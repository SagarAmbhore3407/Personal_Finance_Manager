{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card p-4 shadow">
            <h3 class="text-center">{{ 'Register' if register else 'Login' }}</h3>

            <form method="POST">
                <input class="form-control mb-3" name="username" placeholder="Username" required>
                <input class="form-control mb-3" name="password" type="password" placeholder="Password" required>
                <button class="btn btn-primary w-100">{{ 'Register' if register else 'Login' }}</button>
            </form>

            {% if not register %}
            <p class="mt-3 text-center">Don't have an account? <a href="{{ url_for('auth.register') }}">Register</a></p>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}

{% extends "base.html" %}
{% block content %}
<h3>Your Transactions</h3>
<div class="card p-3 mb-4 shadow-sm">
    <form method="POST" class="row g-2">
        <div class="col-md-4">
            <select class="form-control" name="trans_type" required>
                <option value="income">Income</option>
                <option value="expense" selected>Expense</option>
            </select>
        </div>
        <div class="col-md-4">
            <input class="form-control" name="description" placeholder="Description" required>
        </div>
        <div class="col-md-3">
            <input class="form-control" name="amount" type="number" step="0.01" placeholder="Amount" required>
        </div>
        <div class="col-md-1">
            <button class="btn btn-primary w-100">Add</button>
        </div>
    </form>
</div>

<table class="table table-striped table-bordered shadow">
    <tr><th>Date</th><th>Description</th><th>Amount</th></tr>
    {% for tx in transactions %}
    <tr>
        <td>{{ tx.date.strftime('%Y-%m-%d') }}</td>
        <td>{{ tx.description }}</td>
        <td>₹ {{ tx.amount }}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
